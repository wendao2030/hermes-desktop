<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Desktop</title>
<link rel="icon" href="/static/hermes_logo.png" type="image/png">
<script src="/static/vue.global.prod.js?v=2"></script>
<script src="/static/marked.min.js?v=2"></script>
<style>
:root {
    --bg: #faf6f0;
    --surface: #fefbf7;
    --surface2: #f5ece0;
    --border: #e8ddd0;
    --text: #4a3b30;
    --text2: #9a8575;
    --accent: #c0392b;
    --accent2: #a93226;
    --accent-light: #faeae6;
    --agent-bg: rgba(255,253,250,0.88);
    --danger: #e74c3c;
    --success: #7d6b4e;
    --blue: #2e86c1;
    --blue-light: #ecf5fc;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei UI", sans-serif;
    --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
#app { display:flex; height:100vh; }
.sidebar { width:235px; background:linear-gradient(180deg, #fffaf5 0%, #fef5ee 100%); border-right:1px solid rgba(200,180,155,0.35); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:width .25s ease, min-width .25s ease; }
.sidebar.collapsed { width:0; min-width:0; border-right:none; }
.sidebar-toggle { flex-shrink:0; width:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text2); opacity:.35; transition:opacity .15s; background:transparent; border:none; padding:0; }
.sidebar-toggle:hover { opacity:.8; }
.sidebar-header { padding:20px 16px; border-bottom:1px solid rgba(200,180,155,0.3); background:linear-gradient(135deg, #e74c3c, #c0392b); }
.sidebar-header h2 { font-size:17px; color:#fff; display:flex; align-items:center; gap:8px; }
.sidebar-header h2 img { width:40px; height:40px; border-radius:10px; object-fit:cover; }
.btn-new-session { display:block; width:100%; margin-top:14px; padding:10px 12px; background:rgba(255,255,255,0.25); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:var(--radius); cursor:pointer; font-size:13px; font-weight:600; transition:all .2s; }
.btn-new-session:hover { background:rgba(255,255,255,0.4); transform:translateY(-1px); }
.session-list { flex:1; overflow-y:auto; padding:0; display:flex; flex-direction:column; }
.session-list-header { display:flex; align-items:center; gap:6px; padding:10px 12px 8px 12px; cursor:pointer; user-select:none; flex-shrink:0; border-bottom:1px solid transparent; transition:border-color .15s; }
.session-list-header:hover { border-bottom-color:var(--border); }
.session-list-title { font-size:12px; font-weight:600; color:var(--text2); white-space:nowrap; }
.session-list-count { font-size:10px; background:var(--surface2); color:var(--text2); padding:1px 7px; border-radius:10px; font-weight:500; }
.session-list-toggle { margin-left:auto; display:inline-flex; align-items:center; justify-content:center; color:var(--text2); transition:transform .25s ease; width:20px; height:20px; }
.session-list-toggle.collapsed { transform:rotate(-90deg); }
.session-list-body { display:flex; flex-direction:column; padding:4px 8px 8px 8px; overflow:hidden; transition:max-height .3s ease, opacity .25s ease, padding .3s ease; max-height:600px; opacity:1; }
.session-list-body.collapsed { max-height:0 !important; opacity:0; padding-top:0; padding-bottom:0; pointer-events:none; }
.session-item { padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:5px; transition:background .15s, color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:none; }
.session-item:hover { background:rgba(200,180,155,0.15); }
.session-item.active { background:var(--accent-light); color:#8a2e22; padding-left:11px; }
.session-item .title { color:var(--text); font-weight:500; }
.session-item .date { color:var(--text2); font-size:11px; margin-top:3px; }
.sidebar-footer { padding:14px 16px 36px 16px; border-top:1px solid rgba(200,180,155,0.25); font-size:12px; color:var(--text2); background:rgba(200,180,155,0.06); display:flex; flex-direction:column; gap:8px; margin-top:auto; flex-shrink:0; position:relative; max-height:calc(100vh - 130px); }
.btn-minimize-bubble { width:100%; padding:8px 12px; background:rgba(212,81,58,0.1); color:var(--accent); border:1px solid rgba(212,81,58,0.25); border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; transition:all .15s; text-align:center; }
.btn-minimize-bubble:hover { background:rgba(212,81,58,0.18); transform:translateY(-1px); }
.sidebar-footer-row { display:flex; gap:8px; align-items:center; }
.btn-settings { width:28px; height:28px; padding:0; background:transparent; color:var(--text2); border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:all .15s; display:inline-flex; align-items:center; justify-content:center; line-height:1; flex-shrink:0; }
.btn-settings:hover { background:var(--surface2); }
.btn-settings.active { background:var(--accent-light); border-color:var(--accent); color:var(--accent); }
.btn-settings-item { display:block; width:100%; padding:8px 10px; background:none; color:var(--text); border:1px solid transparent; border-radius:6px; cursor:pointer; font-size:13px; text-align:left; transition:all .15s; }
.btn-settings-item:hover { background:var(--surface2); }
.btn-settings-item.active { background:var(--accent-light); color:var(--accent); }
.settings-icon { display:inline-block; width:20px; text-align:center; margin-right:4px; }
.settings-panel { overflow:hidden; transition:max-height .25s ease, opacity .25s ease, margin .25s ease; max-height:0; opacity:0; margin-top:0; }
.settings-panel.open { max-height:min(360px, calc(100vh - 250px)); opacity:1; margin-top:4px; }
.settings-panel-inner { padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; max-height:calc(100vh - 260px); overflow-y:auto; }
.settings-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; }
.settings-item label { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; color:var(--text); }
.settings-item input[type="checkbox"] { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }
.main { flex:1; display:flex; flex-direction:column; min-width:0; background:linear-gradient(180deg, #fefbf7 0%, #faf6f0 100%); }
.chat-area { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
.chat-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text2); font-size:15px; text-align:center; line-height:2; }
.message { max-width:min(80%, 720px); padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.7; word-wrap:break-word; overflow-wrap:anywhere; user-select:text; -webkit-user-select:text; }
.message.user { align-self:flex-end; background:linear-gradient(135deg, #d44a3e, #c0392b); color:#fff; border-bottom-right-radius:3px; }
.message.agent, .message.agent-streaming { align-self:flex-start; background:rgba(255,252,248,0.92); border:1px solid rgba(200,180,155,0.35); border-bottom-left-radius:3px; color:var(--text); }
.message.tool { align-self:flex-start; background:rgba(250,245,238,0.9); border:1px dashed rgba(200,180,155,0.45); color:var(--text2); box-shadow:none; font-size:12px; margin-left:44px; }
.message.system { align-self:center; background:transparent; color:var(--text2); font-size:12px; text-align:center; max-width:100%; padding:4px 12px; box-shadow:none; }
.msg-row { display:flex; align-items:flex-start; gap:10px; width:100%; max-width:100%; }
.msg-row.user { align-self:stretch; flex-direction:row-reverse; justify-content:flex-start; }
.msg-row.agent { align-self:stretch; justify-content:flex-start; }
.msg-body { display:flex; flex-direction:column; width:fit-content; max-width:min(80%, 720px); min-width:0; }
.msg-row.agent .msg-body { align-items:flex-start; }
.msg-body.has-media { width:min(80%, 720px); }
.msg-row.user .msg-body { align-items:flex-end; }
.msg-time { margin-top:4px; font-size:11px; line-height:1.2; color:rgba(110,92,74,0.58); user-select:text; -webkit-user-select:text; }
.msg-row.user .msg-time { color:rgba(110,92,74,0.55); text-align:right; }
.msg-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.msg-row .message { max-width:100%; flex:0 1 auto; }
.msg-row.user .message { max-width:100%; min-width:44px; text-align:left; white-space:pre-wrap; }
.msg-row.user .message p { margin:0; }
.msg-row.agent .message { border-bottom-left-radius:4px; }
.media-bundle { width:100%; max-width:min(100%, 720px); margin-top:10px; padding:10px; border:1px solid rgba(200,180,155,0.42); border-radius:8px; background:rgba(255,252,248,0.96); box-shadow:0 1px 3px rgba(74,59,48,0.04); }
.media-bundle-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; color:var(--text2); font-size:12px; }
.media-bundle-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.media-open-folder-btn { flex-shrink:0; height:28px; padding:0 12px; border:1px solid rgba(198,58,47,0.25); border-radius:6px; background:rgba(198,58,47,0.08); color:var(--accent); font-size:12px; font-weight:700; cursor:pointer; }
.media-open-folder-btn:hover { background:rgba(198,58,47,0.14); }
.media-gallery { width:100%; display:grid; gap:8px; }
.media-gallery.count-1 { grid-template-columns:minmax(0, min(420px, 100%)); }
.media-gallery.count-2 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
.media-gallery.count-3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.media-gallery.count-4 { grid-template-columns:repeat(4, minmax(0, 1fr)); }
.media-card { min-width:0; overflow:hidden; border:1px solid rgba(200,180,155,0.3); border-radius:6px; background:#f7f0e8; }
.media-preview { width:100%; aspect-ratio:1 / 1; display:block; object-fit:cover; background:#f7f0e8; cursor:pointer; }
.media-gallery.count-1 .media-preview { aspect-ratio:4 / 3; object-fit:contain; max-height:380px; }
video.media-preview { object-fit:contain; background:#1f1a17; cursor:default; }
.message.agent p, .message.agent-streaming p { margin:4px 0; color:var(--text); }
.message.agent pre, .message.agent-streaming pre { background:rgba(248,240,230,0.9); border:1px solid rgba(200,180,155,0.35); border-radius:8px; padding:12px; overflow-x:auto; font-family:var(--mono); font-size:13px; margin:8px 0; color:#4a382a; user-select:text; -webkit-user-select:text; }
.message.agent code, .message.agent-streaming code { font-family:var(--mono); font-size:13px; color:#b84a3d; background:rgba(192,57,43,0.05); padding:1px 5px; border-radius:4px; user-select:text; -webkit-user-select:text; }
.message.agent ul, .message.agent ol, .message.agent-streaming ul, .message.agent-streaming ol { margin:4px 0; padding-left:20px; }
.message.agent blockquote, .message.agent-streaming blockquote { border-left:3px solid rgba(192,57,43,0.25); padding-left:12px; color:var(--text2); margin:8px 0; background:rgba(250,237,235,0.55); border-radius:0 8px 8px 0; }
.input-area { padding:14px 24px; border-top:1px solid rgba(200,180,155,0.3); background:rgba(255,252,248,0.6); }
.input-row { display:flex; gap:10px; align-items:flex-end; }
.input-row textarea { flex:1; padding:12px 16px; background:#fff; border:1px solid rgba(200,180,155,0.4); border-radius:12px; color:var(--text); font-family:var(--font); font-size:14px; resize:none; min-height:44px; max-height:150px; outline:none; line-height:1.5; transition:border-color .2s, box-shadow .2s; }
.input-row textarea:focus { border-color:rgba(192,57,43,0.35); box-shadow:0 0 0 2px rgba(192,57,43,0.08); }
.input-row button { min-width:72px; padding:11px 18px; background:linear-gradient(135deg, #d44a3e, #c0392b); color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; transition:opacity .15s; }
.input-row button:hover { opacity:.9; }
.input-row button:disabled { background:var(--border); color:var(--text2); cursor:not-allowed; box-shadow:none; transform:none; }
.input-row .btn-stop { background:var(--danger); box-shadow:0 2px 6px rgba(231,76,60,0.25); }
.input-row .btn-stop:hover { box-shadow:0 4px 12px rgba(231,76,60,0.35); }
.input-extras { display:flex; gap:10px; margin-top:8px; font-size:12px; color:var(--text2); align-items:center; }
.btn-upload { padding:4px 10px; background:transparent; color:var(--text2); border:1px solid rgba(200,180,155,0.3); border-radius:6px; cursor:pointer; font-size:11px; opacity:.65; transition:opacity .15s, background .15s; }
.btn-upload:hover { opacity:1; background:rgba(200,180,155,0.12); }
.log-panel { position:fixed; bottom:0; left:0; right:0; height:200px; background:#1e1e1e; color:#d4d4d4; border-top:2px solid var(--accent); z-index:100; display:flex; flex-direction:column; font-family:var(--mono); font-size:12px; transition:transform .3s ease; }
.log-panel.collapsed { transform:translateY(100%); pointer-events:none; }
.log-panel-header { display:flex; align-items:center; justify-content:space-between; padding:6px 12px; background:#2d2d2d; border-bottom:1px solid #444; flex-shrink:0; }
.log-panel-header span { color:#888; font-size:11px; }
.log-panel-close { cursor:pointer; color:#888; background:none; border:none; font-size:16px; padding:0 6px; }
.log-panel-close:hover { color:#fff; }
.log-body { flex:1; overflow-y:auto; padding:8px 12px; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
.log-body span { display:block; }
.log-line-info { color:#569cd6; }
.log-line-error { color:#f44747; }
.log-line-warn { color:#dcdcaa; }
.uploaded-files { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; padding-bottom:4px; }
.file-tag { display:inline-flex; align-items:center; gap:5px; padding:4px 12px; background:var(--accent-light); border-radius:20px; font-size:12px; color:var(--accent); border:1px solid var(--border); }
.file-tag .remove { cursor:pointer; color:var(--danger); font-weight:bold; font-size:16px; line-height:1; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.thinking { display:inline-flex; gap:5px; padding:4px 8px; }
.thinking span { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:bounce 1.2s infinite; }
.thinking span:nth-child(2) { animation-delay:.15s; }
.thinking span:nth-child(3) { animation-delay:.3s; }
.thinking-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 20px 14px 20px; padding:10px 16px; background:#fff; border:1px solid rgba(200,180,155,0.25); border-radius:10px; cursor:pointer; transition:border-color .15s, background .15s; user-select:none; flex-shrink:0; }
.thinking-bar:hover { border-color:rgba(200,180,155,0.45); background:#fffdfb; }
.thinking-left { display:flex; align-items:center; gap:8px; }
.thinking-dot { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:bounce 1.2s infinite; opacity:.6; }
.thinking-dot:nth-child(2) { animation-delay:.2s; }
.thinking-dot:nth-child(3) { animation-delay:.35s; }
.thinking-text { font-size:12px; color:var(--text2); white-space:nowrap; letter-spacing:.5px; }
.thinking-right { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text2); opacity:.55; transition:opacity .15s; white-space:nowrap; }
.thinking-bar:hover .thinking-right { opacity:.85; }
.thinking-details { margin:0 20px 14px 20px; padding:10px 14px; background:rgba(250,245,238,0.85); border:1px solid rgba(200,180,155,0.2); border-radius:9px; max-height:200px; overflow-y:auto; flex-shrink:0; }
.thinking-detail-item { font-family:var(--mono); font-size:11.5px; color:var(--text2); line-height:1.8; padding:3px 0; border-bottom:1px solid rgba(200,180,155,0.12); }
.thinking-detail-item:last-child { border-bottom:none; }
@keyframes bounce {
    0%,80%,100% { transform:scale(.6); opacity:.4; }
    40% { transform:scale(1); opacity:1; }
}
.context-menu { position:fixed; z-index:200; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.12); min-width:140px; padding:4px 0; }
.context-menu-item { padding:8px 16px; font-size:13px; cursor:pointer; color:var(--text); transition:background .12s; }
.context-menu-item:hover { background:var(--surface2); }
.context-menu-item.danger { color:var(--danger); }
.context-menu-item.danger:hover { background:#fdedec; }
.sidebar-nav { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding:8px; border-top:1px solid var(--border); }
.sidebar-nav-item { display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:9px; cursor:pointer; font-size:13px; color:var(--text); transition:background .15s, color .15s; border:none; }
.sidebar-nav-item:hover { background:rgba(200,180,155,0.18); }
.sidebar-nav-item.active { background:rgba(192,57,43,0.08); color:#a03226; font-weight:600; }
.sidebar-nav-item .nav-icon { font-size:16px; width:20px; text-align:center; }
.sidebar-nav-item .nav-badge { margin-left:auto; font-size:10px; background:var(--accent); color:#fff; padding:1px 6px; border-radius:8px; }

/* Page views */
.page-view { flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
.page-toolbar { padding:12px 20px; border-bottom:1px solid rgba(200,180,155,0.3); background:rgba(255,252,248,0.5); display:flex; gap:10px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
.page-toolbar .toolbar-title { font-size:15px; font-weight:600; color:var(--text); margin-right:auto; }
.page-list { flex:1; overflow-y:auto; padding:16px 20px; }

/* Card shared */
.card { background:#fff; border:1px solid rgba(200,180,155,0.3); border-radius:11px; padding:14px 16px; margin-bottom:9px; transition:border-color .15s, box-shadow .15s; cursor:pointer; }
.card:hover { border-color:rgba(192,57,43,0.25); box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.card-name { font-weight:600; font-size:14px; color:var(--text); }
.card-desc { font-size:12px; color:var(--text2); line-height:1.5; }
.card-meta { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }

/* Badges */
.badge { padding:3px 10px; border-radius:12px; font-size:11px; font-weight:500; white-space:nowrap; }
.badge.green { background:#e8f5e9; color:#2e7d32; }
.badge.blue { background:#e3f2fd; color:#1565c0; }
.badge.red { background:#fce4ec; color:#c62828; }
.badge.purple { background:#f3e5f5; color:#7b1fa2; }
.badge.gray { background:#f5f5f5; color:#999; }
.badge.yellow { background:#fff8e1; color:#f57f17; }

/* Task cards */
.task-card { cursor:default; }
.task-card:hover { border-color:var(--blue); box-shadow:0 2px 8px rgba(46,134,193,0.08); }
.task-status { font-size:11px; color:var(--text2); }
.task-status .ok { color:#2e7d32; }
.task-status .fail { color:var(--danger); }

/* Buttons */
.btn-sm { padding:5px 12px; border:none; border-radius:7px; cursor:pointer; font-size:11px; font-weight:500; transition:background .15s, opacity .15s; white-space:nowrap; }
.btn-sm.primary { background:linear-gradient(135deg, #d44a3e, #c0392b); color:#fff; }
.btn-sm.primary:hover { opacity:.9; }
.btn-sm.action { background:#3a8cc9; color:#fff; }
.btn-sm.action:hover { opacity:.88; }
.btn-sm.warn { background:#d4a02a; color:#fff; }
.btn-sm.warn:hover { opacity:.9; }
.btn-sm.danger { background:transparent; color:var(--danger); border:1px solid transparent; }
.btn-sm.danger:hover { background:rgba(231,76,60,0.06); }
.btn-sm.ghost { background:transparent; color:var(--text2); border:1px solid transparent; }
.btn-sm.ghost:hover { background:rgba(200,180,155,0.15); }
.btn-sm.star { background:transparent; color:#f39c12; font-size:14px; padding:2px 6px; }
.btn-sm.star.active { color:#f57f17; }

/* Filter tabs */
.filter-tabs { display:flex; gap:4px; }
.filter-tab { padding:5px 13px; border-radius:7px; cursor:pointer; font-size:12px; color:var(--text2); border:1px solid transparent; background:transparent; transition:background .15s, color .15s; }
.filter-tab:hover { background:rgba(200,180,155,0.15); }
.filter-tab.active { background:#3a8cc9; color:#fff; }

/* Home page sections */
.home-section { margin-bottom:24px; }
.home-section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.home-section-title { font-size:14px; font-weight:600; color:var(--text); }
.home-section-link { font-size:12px; color:var(--blue); cursor:pointer; text-decoration:none; }
.home-section-link:hover { text-decoration:underline; }

/* Empty state */
.empty-state { padding:40px; text-align:center; color:var(--text2); }
.empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
.empty-state .empty-title { font-size:15px; font-weight:500; margin-bottom:4px; color:var(--text); }
.empty-state .empty-hint { font-size:12px; }

/* Skills page */
.skills-toolbar { padding:12px 20px; border-bottom:1px solid rgba(200,180,155,0.3); background:rgba(255,252,248,0.5); display:flex; gap:12px; align-items:center; flex-shrink:0; }
.skills-toolbar .search-input { flex:1; padding:8px 14px; background:#fff; border:1px solid rgba(200,180,155,0.35); border-radius:8px; font-size:13px; color:var(--text); outline:none; max-width:320px; }
.skills-toolbar .search-input:focus { border-color:var(--accent); }
.skills-tabs { display:flex; gap:4px; }
.skills-tab { padding:6px 14px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--text2); border:1px solid transparent; background:transparent; transition:background .15s, color .15s; }
.skills-tab:hover { background:rgba(200,180,155,0.15); }
.skills-tab.active { background:#c0392b; color:#fff; }
.skills-shell { flex:1; min-height:0; display:flex; flex-direction:column; }
.pagination-bar { display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 0; margin-top:8px; }
.page-btn { padding:4px 12px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text); cursor:pointer; font-size:12px; }
.page-btn:disabled { opacity:.4; cursor:default; }
.page-btn:hover:not(:disabled) { border-color:var(--accent); }
.page-info { font-size:12px; color:var(--text2); }
.skills-list { flex:1; min-height:0; overflow-y:auto; padding:16px 20px; }
.skill-detail-panel { flex:1; min-height:0; overflow-y:auto; padding:20px; }
.skill-detail-back { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; background:rgba(200,180,155,0.12); border:none; border-radius:7px; cursor:pointer; font-size:13px; color:var(--text); margin-bottom:16px; }
.skill-detail-back:hover { background:rgba(200,180,155,0.22); }
.skill-detail-content { background:#fff; border:1px solid rgba(200,180,155,0.3); border-radius:11px; padding:20px; font-size:14px; line-height:1.8; }
.skill-detail-content h1,.skill-detail-content h2,.skill-detail-content h3 { color:var(--accent); margin:12px 0 6px; }
.skill-detail-content code { font-family:var(--mono); font-size:13px; background:rgba(192,57,43,0.06); padding:1px 4px; border-radius:4px; }
.skill-detail-content pre { background:rgba(248,240,230,0.9); border:1px solid rgba(200,180,155,0.35); border-radius:8px; padding:12px; overflow-x:auto; font-family:var(--mono); font-size:13px; margin:8px 0; }
.market-card .install-btn { padding:5px 14px; background:linear-gradient(135deg, #d44a3e, #c0392b); color:#fff; border:none; border-radius:7px; cursor:pointer; font-size:12px; font-weight:500; transition:opacity .15s; }
.market-card .install-btn:hover { opacity:.9; }
.market-card .install-btn:disabled { background:#ccc; cursor:not-allowed; }
.market-card .install-btn.installed { background:var(--success); }

/* Action buttons below agent messages */
.msg-actions { display:flex; gap:8px; margin-top:8px; }
.msg-actions button { display:inline-flex; align-items:center; gap:2px; padding:3px 9px; background:transparent; border:1px solid transparent; border-radius:5px; cursor:pointer; font-size:11px; font-weight:400; transition:opacity .15s, background .15s, color .15s; opacity:.5; color:var(--text2); }
.msg-actions button:hover { opacity:1; }
.btn-save-task:hover { color:#2e86c1; border-color:rgba(200,180,155,0.35); background:#f0f7ff; }

/* Quick input on home */
.home-input { padding:20px; }
.home-input .input-row textarea { min-height:50px; }

/* Recent sessions on home */
.recent-session { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:9px; cursor:pointer; font-size:13px; transition:background .15s; border:none; }
.recent-session:hover { background:rgba(200,180,155,0.15); }
.recent-session .session-title { color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.recent-session .session-time { color:var(--text2); font-size:11px; margin-left:12px; flex-shrink:0; }

/* Employee list in sidebar */
.employee-list { padding-left:8px; }
.sidebar-employee-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:5px; transition:background .15s, color .15s; border:none; }
.sidebar-employee-item:hover { background:rgba(200,180,155,0.15); }
.sidebar-employee-item.active { background:var(--accent-light); color:#8a2e22; }
.emp-emoji { font-size:22px; flex-shrink:0; width:30px; text-align:center; }
.emp-info { flex:1; min-width:0; }
.emp-name { font-weight:600; font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.emp-role { font-size:11px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Employee chat top bar */
.emp-top-bar { padding:12px 20px; border-bottom:1px solid rgba(200,180,155,0.3); background:rgba(255,252,248,0.6); display:flex; align-items:center; gap:10px; flex-shrink:0; }
.emp-top-bar .emp-avatar { font-size:28px; }
.emp-top-bar .emp-name-big { font-weight:600; font-size:15px; color:var(--text); }
.emp-top-bar .emp-role-big { font-size:12px; color:var(--text2); }
.emp-top-bar .emp-actions { margin-left:auto; display:flex; gap:6px; }
.emp-top-bar .emp-actions button { padding:6px 12px; border-radius:7px; cursor:pointer; font-size:12px; font-weight:500; border:1px solid transparent; transition:all .15s; }
.emp-top-bar .btn-emp-trigger { background:linear-gradient(135deg, #d44a3e, #c0392b); color:#fff; }
.emp-top-bar .btn-emp-trigger:hover { opacity:.9; }
.emp-top-bar .btn-emp-workflow { background:transparent; color:var(--text2); border-color:var(--border); }
.emp-top-bar .btn-emp-workflow:hover { background:rgba(200,180,155,0.15); }
.emp-top-bar .btn-emp-edit { background:transparent; color:var(--text2); border-color:var(--border); }
.emp-top-bar .btn-emp-edit:hover { background:rgba(200,180,155,0.15); }

/* Learning section in edit dialog */
.learn-section { background:rgba(46,134,193,0.04); border:1px solid rgba(46,134,193,0.15); border-radius:10px; padding:14px; margin-top:4px; }
.learn-section label { font-size:12px; color:var(--blue); font-weight:600; display:block; margin-bottom:8px; }
.learn-upload-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.learn-file-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.learn-file-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; background:rgba(46,134,193,0.08); border:1px solid rgba(46,134,193,0.2); border-radius:12px; font-size:11px; color:var(--blue); }
.learn-file-tag .remove { cursor:pointer; font-weight:bold; font-size:14px; line-height:1; }
.learn-depth-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.learn-depth-row select { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:7px; font-size:12px; background:#fff; color:var(--text); }
.learn-btn-row { margin-bottom:4px; }
.learn-hint { font-size:11px; color:var(--text2); margin-top:6px; }

/* Home page employee cards */
.emp-card { cursor:pointer; transition:transform .15s, box-shadow .15s; padding:16px; }
.emp-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,0.1); }
.emp-card-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.emp-card-header .emp-emoji { font-size:28px; flex-shrink:0; width:36px; text-align:center; }
.emp-card-desc { font-size:12px; color:var(--text2); margin-bottom:10px; line-height:1.5; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.emp-card-actions { display:flex; gap:6px; justify-content:flex-end; }
.empty-hint { text-align:center; padding:24px 0; font-size:13px; color:var(--text2); }

/* Employee submenu under sidebar nav */
.emp-submenu { padding:2px 4px 4px 20px; border-left:1px solid rgba(200,180,155,0.15); margin-left:12px; }
.emp-submenu .sidebar-employee-item { padding:8px 10px; font-size:12px; }
.emp-submenu .emp-emoji { font-size:18px; width:24px; }
.emp-submenu .emp-name { font-size:12px; }
.emp-submenu .emp-role { font-size:10px; }

/* Add employee + button on nav item */
.emp-add-btn { display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;line-height:1;cursor:pointer;font-weight:bold;transition:opacity .15s; flex-shrink:0; }
.emp-add-btn:hover { opacity:.85; }
.emp-toggle-btn { display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:10px;color:var(--text2);margin-left:auto;margin-right:4px;cursor:pointer;border-radius:3px;flex-shrink:0;transition:color .15s; }
.emp-toggle-btn:hover { color:var(--text); background:rgba(200,180,155,0.2); }

/* Home hero - Hermes main chat card */
.home-hero { display:flex;align-items:center;gap:16px;padding:20px;background:linear-gradient(135deg,rgba(220,80,60,0.06),rgba(255,252,248,0.9));border:1px solid rgba(220,80,60,0.12);border-radius:14px;margin-bottom:16px;cursor:pointer;transition:transform .15s,box-shadow .15s; }
.home-hero:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.08); }
.home-hero .hero-avatar { width:56px;height:56px;border-radius:14px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,0.1); flex-shrink:0; }
.home-hero .hero-info { display:flex;flex-direction:column;gap:3px; }
.home-hero .hero-info strong { font-size:16px;color:var(--text); }
.home-hero .hero-info small { font-size:12px;color:var(--text2); }

/* Emoji picker */
.emoji-picker { position:relative; }
.emoji-picker-current { display:inline-flex;align-items:center;justify-content:center;width:48px;height:40px;font-size:26px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;transition:border-color .15s; user-select:none; }
.emoji-picker-current:hover { border-color:var(--blue); }
.emoji-picker-grid { position:absolute;top:calc(100% + 4px);left:0;z-index:400;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.15);width:280px;max-height:320px;overflow-y:auto; }
.emoji-option { display:flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:22px;cursor:pointer;border-radius:6px;transition:background .1s; user-select:none; }
.emoji-option:hover { background:rgba(200,180,155,0.2); }
.emoji-option.active { background:var(--accent-light); outline:2px solid var(--accent); }

[v-cloak] { display: none; }
</style>
</head>
<body>
<div id="app" v-cloak>
    <template v-if="appReady">
    <div class="sidebar" :class="{ collapsed: sidebarCollapsed }">
        <div class="sidebar-header" @click="switchToHome()" style="cursor:pointer;">
            <h2><img src="/static/hermes_logo.png" alt="Hermes"> Hermes 超级员工</h2>
        </div>
        <div class="sidebar-nav">
            <div class="sidebar-nav-item" :class="{ active: activeView === 'chat' }" @click="goToMainChat()">
                <span class="nav-icon">💬</span> 对话
            </div>
            <div class="sidebar-nav-item" :class="{ active: activeView === 'team' }" @click="toggleEmployeeList($event)">
                <span class="nav-icon">📁</span> 我的员工
                <span class="nav-badge" v-if="employees.length">{{ employees.length }}</span>
                <span class="emp-expand-icon">{{ employeeListExpanded ? '▾' : '▸' }}</span>
                <span class="emp-add-btn" @click.stop="showNewEmployeeDialog = true" title="添加员工">+</span>
            </div>
            <div v-if="employees.length > 0 && employeeListExpanded" class="emp-submenu">
                <div class="employee-list">
                <div
                    v-for="emp in employees"
                    :key="emp.id"
                    class="sidebar-employee-item"
                    :class="{ active: currentSessionId && currentSessionId.startsWith(emp.session_id || emp.id) }"
                    @click="chatWithEmployee(emp)"
                    @contextmenu.prevent="showEmpContextMenu($event, emp)"
                >
                    <span class="emp-emoji">{{ emp.emoji || '😊' }}</span>
                    <div class="emp-info">
                        <div class="emp-name">{{ emp.name }}</div>
                        <div class="emp-role">{{ emp.role || '未设定角色' }}</div>
                    </div>
                </div>
                </div>
            </div>
            <div class="sidebar-nav-item" :class="{ active: activeView === 'collabAgents' }" @click="switchToCollabAgents()">
                <span class="nav-icon">🤝</span> 协作智能体
            </div>
            <div class="sidebar-nav-item" :class="{ active: activeView === 'skills' }" @click="switchToSkills()">
                <span class="nav-icon">🧩</span> 技能
            </div>
        </div>
        <!-- Skill context menu -->
        <div v-if="skillContextMenu.visible" class="context-menu" :style="{ left: skillContextMenu.x + 'px', top: skillContextMenu.y + 'px' }" @click.stop @mouseleave="hideSkillContextMenu">
            <div class="context-menu-item danger" @click="deleteSkillFromMenu(skillContextMenu.skill)">🗑 删除技能</div>
        </div>
        <!-- Employee context menu -->
        <div v-if="empContextMenu.visible" class="context-menu" :style="{ left: empContextMenu.x + 'px', top: empContextMenu.y + 'px' }" @click.stop @mouseleave="hideEmpContextMenu">
            <div class="context-menu-item" @click="openEditEmployeeDialog(empContextMenu.emp)">✏️ 编辑</div>
            <div class="context-menu-item danger" @click="deleteEmployeeFromMenu(empContextMenu.emp)">🗑 删除</div>
        </div>
        <div class="sidebar-footer">
            <button class="btn-minimize-bubble" @click="minimizeToBubble">最小化到悬浮窗</button>
            <div class="sidebar-footer-row">
                <span>模型: {{ config.model }}</span>
            </div>
            <button class="btn-settings" :class="{ active: showSettings }" @click="showSettings = !showSettings" title="设置" style="position:absolute;bottom:4px;left:8px;">⚙</button>
            <div class="settings-panel" :class="{ open: showSettings }">
                <div class="settings-panel-inner">
                    <button class="btn-settings-item" @click="showLog = !showLog; showSettings=false;" :class="{ active: showLog }"><span class="settings-icon">📋</span> 查看服务日志</button>
                    <button class="btn-settings-item" @click="syncPromptsToConsole" :disabled="promptSyncBusy">
                        <span class="settings-icon">📤</span> {{ promptSyncBusy ? '同步中...' : '同步 Prompt 到服务器' }}
                    </button>
                    <button class="btn-settings-item" @click="openWorkDirDialog"><span class="settings-icon">📁</span> 工作目录</button>
                    <button class="btn-settings-item" @click="createVersionSnapshot"><span class="settings-icon">💾</span> 保存版本快照</button>
                    <button class="btn-settings-item" @click="openVersionDialog"><span class="settings-icon">⏪</span> 恢复旧版本</button>
                    <div class="btn-settings-item" style="display:flex;align-items:center;padding-right:6px;">
                        <span class="settings-icon">🗑</span> <span style="font-size:13px;">清除聊天</span>
                        <select @change="clearChatByRange($event.target.value); $event.target.value='';" style="margin-left:auto;padding:3px 4px;border:1px solid var(--border);border-radius:4px;font-size:11px;background:#fff;color:var(--text);max-width:100px;">
                            <option value="">范围...</option>
                            <option value="today">今天</option>
                            <option value="week">一周</option>
                            <option value="month">一月</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar-toggle" @click="toggleSidebar" :title="sidebarCollapsed ? '展开侧边栏' : '收起侧边栏'">
        <svg width="12" height="12" viewBox="0 0 12 12" :style="{transform: sidebarCollapsed ? '' : 'rotate(180deg)'}"><path d="M4 2L8 6L4 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="main">

        <!-- ========== HOME VIEW ========== -->
        <div v-if="activeView === 'home'" class="page-view">
            <div class="page-list">
                <!-- Hermes 主对话入口 -->
                <div class="home-hero" @click="activeView = 'chat'" style="cursor:pointer;">
                    <img src="/static/hermes_logo.png" alt="Hermes" class="hero-avatar">
                    <div class="hero-info">
                        <strong>Hermes 主对话</strong>
                        <small>点击进入与 AI 的主对话</small>
                    </div>
                </div>


                <!-- 我的团队 -->
                <div class="home-section">
                    <div class="home-section-header">
                        <span class="home-section-title">👥 我的团队</span>
                        <a class="home-section-link" @click="switchToTeam()">管理员工 →</a>
                    </div>
                    <div v-if="employees.length > 0" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
                        <div v-for="emp in employees" :key="emp.id" class="card emp-card" @click="chatWithEmployee(emp)">
                            <div class="emp-card-header">
                                <span class="emp-emoji">{{ emp.emoji || '😊' }}</span>
                                <div>
                                    <div class="emp-name" style="font-weight:600;font-size:14px;">{{ emp.name }}</div>
                                    <div class="emp-role" style="font-size:11px;color:var(--text2);margin-top:2px;">{{ emp.role || '未设定角色' }}</div>
                                </div>
                            </div>
                            <!-- Dynamic task status instead of static work_content -->
                            <div class="emp-card-desc">
                                <template v-if="emp.latest_task">
                                    <span v-if="emp.latest_task.status === 'running'" style="color:var(--blue);">🔄 执行中：{{ emp.latest_task.title || '任务' }}</span>
                                    <span v-else-if="emp.latest_task.status === 'done'" style="color:var(--green);">✅ 已完成：{{ emp.latest_task.title || '任务' }}</span>
                                    <span v-else-if="emp.latest_task.status === 'failed'" style="color:var(--danger);">❌ 失败：{{ emp.latest_task.title || '任务' }}</span>
                                    <span v-else-if="emp.latest_task.status === 'planning'" style="color:var(--text2);">📋 待确认：{{ emp.latest_task.title || '任务' }}</span>
                                    <span v-else style="color:var(--text2);">📌 {{ emp.latest_task.title || '任务' }}</span>
                                </template>
                                <template v-else>
                                    {{ emp.work_content || '暂无任务' }}
                                </template>
                            </div>
                            <div class="emp-card-actions">
                                <button class="btn-sm action" @click.stop="chatWithEmployee(emp)">💬 对话</button>
                                <button class="btn-sm ghost" @click.stop="openEditEmployeeDialog(emp)" style="font-size:11px;padding:4px 8px;">✏ 编辑</button>
                            </div>
                        </div>
                    </div>
                    <div v-else class="empty-hint">
                        <span>还没有员工，<a @click="showNewEmployeeDialog = true" style="color:var(--blue);cursor:pointer;">点击添加第一个员工</a></span>
                    </div>
                </div>

                <!-- 常用任务 -->
                <div class="home-section" v-if="pinnedTasks.length > 0">
                    <div class="home-section-header">
                        <span class="home-section-title">⭐ 常用任务</span>
                        <a class="home-section-link" @click="switchToTasks()">查看全部 →</a>
                    </div>
                    <div v-for="job in pinnedTasks.slice(0, 4)" :key="job.id" class="card task-card">
                        <div class="card-header">
                            <span class="card-name">{{ job.name || '未命名任务' }}</span>
                            <span v-if="job.paused" class="badge gray">已暂停</span>
                            <span v-else-if="job.schedule" class="badge blue">⏱ {{ formatSchedule(job.schedule) }}</span>
                            <span v-else class="badge green">手动触发</span>
                        </div>
                        <div class="card-desc">{{ job.prompt || '暂无描述' }}</div>
                        <div class="card-meta" style="justify-content:space-between;">
                            <span class="task-status">
                                <span v-if="job.last_run_at">上次: {{ formatDate(job.last_run_at) }}</span>
                                <span v-if="job.last_status" :class="job.last_status === 'ok' ? 'ok' : 'fail'">
                                    {{ job.last_status === 'ok' ? ' ✅' : ' ❌' }}
                                </span>
                            </span>
                            <button class="btn-sm action" @click.stop="triggerJob(job.id)">▶ 执行</button>
                        </div>
                    </div>
                </div>

                <!-- 失败 / 未完成任务 -->
                <div class="home-section" v-if="failedTasks.length > 0">
                    <div class="home-section-header">
                        <span class="home-section-title">⚠️ 需要关注的任务</span>
                    </div>
                    <div v-for="job in failedTasks.slice(0, 4)" :key="job.id" class="card task-card" style="border-left: 3px solid var(--danger);">
                        <div class="card-header">
                            <span class="card-name">{{ job.name || '未命名任务' }}</span>
                            <span class="badge red">上次失败</span>
                        </div>
                        <div class="card-desc">{{ job.prompt || '暂无描述' }}</div>
                        <div class="card-meta" style="justify-content:space-between;">
                            <span class="task-status">
                                <span v-if="job.last_run_at">上次: {{ formatDate(job.last_run_at) }}</span>
                                <span class="fail"> ❌</span>
                            </span>
                            <button class="btn-sm action" @click.stop="triggerJob(job.id)">🔄 重试</button>
                        </div>
                    </div>
                </div>

                <!-- Empty welcome -->
                <div v-if="employees.length === 0 && cronJobs.length === 0" class="chat-empty">
                    <div>
                        <img src="/static/hermes_logo.png" alt="Hermes" style="width:100px;height:100px;border-radius:20px;object-fit:cover;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.12);">
                        <strong>欢迎使用 Hermes 超级员工</strong><br>
                        <small style="color:var(--text2);">在下方输入你的问题开始使用，或添加你的第一个员工</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== CHAT VIEW ========== -->
        <div v-if="activeView === 'chat'" class="chat-area" ref="chatArea">

    </div>

    <!-- ========== VERSION BACKUP / RESTORE DIALOG ========== -->
    <div v-if="showVersionDialog" style="position:fixed;inset:0;background:rgba(0,0,0,0.38);z-index:340;display:flex;align-items:center;justify-content:center;" @click.self="showVersionDialog=false">
        <div style="background:#fff;border-radius:12px;padding:22px;width:560px;max-width:92vw;max-height:78vh;overflow-y:auto;box-shadow:0 12px 36px rgba(0,0,0,0.18);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                <div>
                    <div style="font-size:17px;font-weight:700;color:var(--text);">版本备份与恢复</div>
                    <div style="font-size:12px;color:var(--text2);margin-top:4px;">包含聊天记录、MEMORY.md、USER.md。恢复前会自动再备份一次。</div>
                </div>
                <button style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);" @click="showVersionDialog=false">&times;</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn-sm primary" @click="createVersionSnapshot" :disabled="versionBusy">保存当前版本</button>
                <button class="btn-sm ghost" @click="loadVersionSnapshots" :disabled="versionBusy">刷新列表</button>
            </div>
            <div v-if="versionBusy" style="padding:18px;text-align:center;color:var(--text2);">正在处理...</div>
            <div v-else-if="versionSnapshots.length === 0" style="padding:28px;text-align:center;color:var(--text2);border:1px dashed var(--border);border-radius:10px;">还没有版本快照</div>
            <div v-else style="display:flex;flex-direction:column;gap:10px;">
                <div v-for="snap in versionSnapshots" :key="snap.id" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface);">
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                        <div style="min-width:0;">
                            <div style="font-size:14px;font-weight:700;color:var(--text);">{{ snap.label || '未命名快照' }}</div>
                            <div style="font-size:12px;color:var(--text2);margin-top:4px;">{{ formatVersionSnapshot(snap) }}</div>
                            <div style="font-size:12px;color:var(--text2);margin-top:4px;word-break:break-all;">{{ snap.id }}</div>
                        </div>
                        <button class="btn-sm primary" @click="restoreVersionSnapshot(snap)" :disabled="versionBusy">恢复</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== WORK DIRECTORY DIALOG ========== -->
    <div v-if="showWorkDirDialog" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:335;display:flex;align-items:center;justify-content:center;" @click.self="showWorkDirDialog = false">
        <div style="background:#fff;border-radius:12px;padding:24px;width:500px;max-width:calc(100vw - 40px);box-shadow:0 8px 32px rgba(0,0,0,0.18);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                <span style="font-size:16px;font-weight:600;">工作目录</span>
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);" @click="showWorkDirDialog = false">&times;</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
                <div style="font-size:12px;color:var(--text2);line-height:1.7;">
                    员工没有单独设置时，会默认使用这里。读取、创建、修改用户文件时，也会优先参考这个目录。
                </div>
                <label style="font-size:12px;color:var(--text2);display:block;">全局工作目录</label>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input v-model="workDirDraft" style="flex:1;min-width:0;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;" placeholder="例如：D:\工作区">
                    <button class="btn-sm ghost" @click="chooseGlobalWorkDir" type="button">选择</button>
                </div>
                <div v-if="config.global_work_dir" style="font-size:12px;color:var(--text2);word-break:break-all;">当前：{{ config.global_work_dir }}</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end;">
                <button class="btn-sm ghost" @click="openGlobalWorkDir" :disabled="!config.global_work_dir">打开当前目录</button>
                <button class="btn-sm ghost" @click="showWorkDirDialog = false">取消</button>
                <button class="btn-sm primary" @click="saveGlobalWorkDir" :disabled="workDirBusy">{{ workDirBusy ? '保存中...' : '保存' }}</button>
            </div>
        </div>
    </div>

    <!-- ========== CAPTURE WORKFLOW / EXPERIENCE DIALOG ========== -->
    <div v-if="showWorkflowCaptureDialog" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:330;display:flex;align-items:center;justify-content:center;" @click.self="closeWorkflowCaptureDialog">
        <div style="background:#fff;border-radius:12px;padding:24px;width:460px;max-height:75vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                <span style="font-size:16px;font-weight:600;">把这次做法记下来</span>
                <button style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);" @click="closeWorkflowCaptureDialog">&times;</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px;">
                <div>
                    <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">这次怎么保存</label>
                    <select v-model="workflowCaptureMode" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;">
                        <option value="experience">只记为经验</option>
                        <option value="new">保存成新的常用任务</option>
                        <option value="update">升级当前常用任务</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">给这个做法起个名字</label>
                    <input v-model="workflowCaptureName" style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;" placeholder="例如：小红书科技风封面做法">
                </div>
                <div>
                    <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">希望员工下次记住什么</label>
                    <textarea v-model="workflowCaptureNotes" rows="5" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;resize:vertical;" placeholder="例如：下次先找参考图，标题要更醒目，风格保持干净一点"></textarea>
                </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
                <button class="btn-sm ghost" @click="closeWorkflowCaptureDialog">先不保存</button>
                <button class="btn-sm primary" @click="saveWorkflowCapture" :disabled="isCapturingWorkflow">{{ isCapturingWorkflow ? '保存中...' : '保存' }}</button>
            </div>
        </div>
    </div>
    </template>
</div>

<script src="/static/app.js?v=81"></script>
</body>
</html>
